name: PathTime
options:
  bundleIdPrefix: com.pathtime
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  PathTimeShared:
    path: PathTimeShared

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""          # 填入你的 Apple Developer Team ID

targets:

  # ── iOS App ────────────────────────────────────────────────────────────────
  PathTime:
    type: application
    platform: iOS
    sources:
      - path: PathTime
    dependencies:
      - package: PathTimeShared
      - target: PathTimeWidget
        embed: true
        codeSign: false
      - target: PathTimeWatch
        embed: true
        codeSign: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pathtime.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    entitlements:
      path: PathTime/PathTime.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.pathtime.shared

  # ── Widget Extension ────────────────────────────────────────────────────────
  PathTimeWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: PathTimeWidget
    dependencies:
      - package: PathTimeShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pathtime.app.widget
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: PathTimeWidget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: PathTimeWidget/PathTimeWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.pathtime.shared

  # ── Watch App ───────────────────────────────────────────────────────────────
  PathTimeWatch:
    type: application
    platform: watchOS
    sources:
      - path: PathTimeWatch
    dependencies:
      - package: PathTimeShared
      - target: PathTimeWatchWidget
        embed: true
        codeSign: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pathtime.app.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.leowang.pathtime.app
    entitlements:
      path: PathTimeWatch/PathTimeWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.pathtime.shared

  # ── Watch Widget Extension (Complications) ──────────────────────────────────
  PathTimeWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - path: PathTimeWatchWidget
    dependencies:
      - package: PathTimeShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pathtime.app.watchkitapp.complication
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: PathTimeWatchWidget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: PathTimeWatchWidget/PathTimeWatchWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.pathtime.shared
